
<!DOCTYPE html>
<html>
<head>
    <title>Exhibit Details - Museum Explorer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Museum Explorer</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="interests.html">Interests</a>
            <a href="recommendations.html">Exhibits</a>
            <a href="favourites.html">Favourites</a>
            <a href="route.html">Visit Route</a>
        </nav>
    </header>

    <section class="details-section">

        <h2 id="exhibit-name">Exhibit Details</h2>

        <div class="details-card">

            <div class="details-image" id="exhibit-image">
            </div>

            <div class="details-content">

                <h2 id="exhibit-title"></h2>

                <p><strong>Category:</strong> <span id="category"></span></p>

                <p><strong>Period:</strong> <span id="period"></span></p>

                <p><strong>Origin:</strong> <span id="origin"></span></p>

                <h3>About the Exhibit</h3>
                <p id="about"></p>

                <h3>Historical Importance</h3>
                <p id="importance"></p>

                <a href="recommendations.html" class="back-button">
                    Back to Exhibits
                </a>

            </div>
        </div>

    </section>

    <script src="script.js"></script>

</body>
</html>
